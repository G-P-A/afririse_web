<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfriRise - V2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family: -apple-system, system-ui, sans-serif}
.header{background:linear-gradient(90deg,#6a11cb,#2575fc);padding:14px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.header b{font-size:22px}
.header span{background:#0003;padding:6px 12px;border-radius:20px;font-size:12px}
.container{max-width:550px;margin:0 auto;padding:12px}
.card{background:#1c1c1e;border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid #2a2a2a}
textarea{width:100%;background:#2c2c2e;border:0;color:#fff;padding:14px;border-radius:12px;font-size:16px;outline:none;resize:none;min-height:70px}
.row{display:flex;gap:10px;margin-top:12px;align-items:center}
.btn{flex:1;background:linear-gradient(90deg,#6a11cb,#2575fc);border:0;color:#fff;padding:12px;border-radius:25px;font-weight:bold;font-size:15px}
.btn2{background:#2c2c2e;border:0;color:#aaa;padding:10px 14px;border-radius:20px}
input[type=file]{display:none}
.post{animation:pop .2s}
@keyframes pop{0%{transform:scale(.95);opacity:0}100%{transform:scale(1);opacity:1}}
.post-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.avatar{width:40px;height:40px;background:linear-gradient(135deg,#6a11cb,#2575fc);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.post-img{width:100%;border-radius:12px;margin-top:10px;max-height:400px;object-fit:cover}
.actions{display:flex;gap:20px;margin-top:12px;border-top:1px solid #2a2a2a;padding-top:10px}
.actions button{background:0;border:0;color:#aaa;display:flex;gap:6px;align-items:center;font-size:14px}
.actions button.liked{color:#ff3040}
.small{color:#888;font-size:12px}
</style>
</head>
<body>
<div class="header">
<b>AfriRise 🌍</b>
<span id="userLabel" onclick="trocarNome()">G-P-A</span>
</div>
<div class="container">
<div class="card">
<textarea id="texto" placeholder="O que está a acontecer, G-P-A?"></textarea>
<img id="preview" class="post-img" style="display:none">
<div class="row">
<label class="btn2" for="file">📷 Foto</label>
<input type="file" id="file" accept="image/*" onchange="loadImg(event)">
<button class="btn" onclick="publicar()">Publicar</button>
</div>
</div>
<div id="feed"></div>
</div>

<script>
let nome = localStorage.getItem('afri_nome') || 'G-P-A';
let posts = JSON.parse(localStorage.getItem('afri_posts') || '[]');
let imgBase64 = '';

document.getElementById('userLabel').innerText = nome;
document.getElementById('texto').placeholder = `O que está a acontecer, ${nome}?`;

function trocarNome(){
 let n = prompt('Qual teu nome?', nome);
 if(n){ nome=n; localStorage.setItem('afri_nome', n); document.getElementById('userLabel').innerText=n; location.reload(); }
}

function loadImg(e){
 let f=e.target.files[0];
 if(!f)return;
 let r=new FileReader();
 r.onload=()=>{ imgBase64=r.result; document.getElementById('preview').src=imgBase64; document.getElementById('preview').style.display='block'; }
 r.readAsDataURL(f);
}

function publicar(){
 let t=document.getElementById('texto').value.trim();
 if(!t && !imgBase64) return;
 let p={id:Date.now(), nome:nome, texto:t, img:imgBase64, likes:0, liked:false, time:'agora'};
 posts.unshift(p);
 salvar();
 document.getElementById('texto').value='';
 document.getElementById('preview').style.display='none';
 imgBase64='';
}

function salvar(){
 localStorage.setItem('afri_posts', JSON.stringify(posts));
 render();
}

function like(id){
 let p=posts.find(x=>x.id===id);
 if(p.liked){ p.likes--; p.liked=false; } else { p.likes++; p.liked=true; }
 salvar();
}

function del(id){
 if(!confirm('Apagar?'))return;
 posts=posts.filter(x=>x.id!==id);
 salvar();
}

function render(){
 let f=document.getElementById('feed');
 f.innerHTML='';
 posts.forEach(p=>{
  let d=document.createElement('div');
  d.className='card post';
  d.innerHTML=`
  <div class="post-head">
   <div class="avatar">${p.nome[0].toUpperCase()}</div>
   <div><b>${p.nome}</b><br><span class="small">${p.time}</span></div>
   <span style="margin-left:auto" onclick="del(${p.id})">...</span>
  </div>
  ${p.texto?`<p style="font-size:16px;line-height:1.4">${p.texto}</p>`:''}
  ${p.img?`<img src="${p.img}" class="post-img">`:''}
  <div class="actions">
   <button onclick="like(${p.id})" class="${p.liked?'liked':''}">❤️ ${p.likes>0?p.likes:''} Like</button>
   <button>💬 Comentar</button>
   <button>↗️ Partilhar</button>
  </div>`;
  f.appendChild(d);
 });
}
render();
</script>
</body>
</html>
